name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No browser needed — test_utils.py covers the pure logic only.
      - name: Run tests
        run: python3 test_utils.py

      - name: Check all modules import cleanly
        run: python3 -m py_compile config.py utils.py dice_bot.py setup.py test_utils.py
